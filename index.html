<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XOXO — Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts: Clash Display + DM Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ═══════════════════════════════
       BACKGROUND GRID DECORATION
  ═══════════════════════════════ -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- ═══════════════════════════════
       MAIN APP WRAPPER
  ═══════════════════════════════ -->
  <div class="app">

    <!-- ── HEADER ── -->
    <header class="header">
      <div class="logo">
        <span class="logo-x">X</span>
        <span class="logo-sep">◈</span>
        <span class="logo-o">O</span>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
        <span class="theme-icon">☽</span>
      </button>
    </header>

    <!-- ── MODE SELECTOR ── -->
    <section class="mode-selector" id="modeSelector">
      <h1 class="title">Choose Mode</h1>
      <div class="mode-cards">
        <button class="mode-card" id="btn2P" data-mode="2p">
          <span class="mode-icon">👥</span>
          <span class="mode-label">2 Players</span>
          <span class="mode-sub">Local PvP</span>
        </button>
        <button class="mode-card" id="btnAIEasy" data-mode="easy">
          <span class="mode-icon">🤖</span>
          <span class="mode-label">AI — Easy</span>
          <span class="mode-sub">Beginner bot</span>
        </button>
        <button class="mode-card" id="btnAIHard" data-mode="hard">
          <span class="mode-icon">💀</span>
          <span class="mode-label">AI — Hard</span>
          <span class="mode-sub">Unbeatable</span>
        </button>
      </div>
    </section>

    <!-- ── GAME ARENA ── -->
    <section class="game-arena hidden" id="gameArena">

      <!-- Status bar -->
      <div class="status-bar">
        <div class="player-tag" id="playerTag">
          <span class="turn-indicator" id="turnSymbol">X</span>
          <span class="turn-label" id="turnLabel">Player 1's turn</span>
        </div>
        <button class="btn-back" id="btnBack" aria-label="Back to menu">← Menu</button>
      </div>

      <!-- Game board -->
      <div class="board-container">
        <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board">
          <!-- 9 cells generated by JS -->
        </div>
        <!-- SVG winning line overlay -->
        <svg class="win-line-svg" id="winLineSvg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <line id="winLine" x1="0" y1="0" x2="0" y2="0" />
        </svg>
      </div>

      <!-- Scoreboard -->
      <div class="scoreboard">
        <div class="score-item" id="scoreX">
          <span class="score-name">X</span>
          <span class="score-value" id="scoreXVal">0</span>
        </div>
        <div class="score-item draws">
          <span class="score-name">Draws</span>
          <span class="score-value" id="scoreDrawVal">0</span>
        </div>
        <div class="score-item" id="scoreO">
          <span class="score-name">O</span>
          <span class="score-value" id="scoreOVal">0</span>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="action-buttons">
        <button class="btn-restart" id="btnRestart">↺ Restart</button>
        <button class="btn-reset-score" id="btnResetScore">Reset Scores</button>
      </div>

    </section>

    <!-- ── RESULT MODAL ── -->
    <div class="modal-overlay hidden" id="modalOverlay">
      <div class="modal" id="modal">
        <div class="modal-icon" id="modalIcon">🏆</div>
        <h2 class="modal-title" id="modalTitle">Player X Wins!</h2>
        <p class="modal-sub" id="modalSub">Brilliant move.</p>
        <div class="modal-actions">
          <button class="btn-play-again" id="btnPlayAgain">Play Again</button>
          <button class="btn-menu" id="btnMenu">Main Menu</button>
        </div>
      </div>
    </div>

  </div><!-- /app -->

  <!-- Audio elements (generated tones via Web Audio API — no file deps) -->

  <script src="script.js"></script>
</body>
</html>
